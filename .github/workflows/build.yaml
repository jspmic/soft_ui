name: Flutter CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "ERROR: HOST secret is empty or not configured."
            exit 1
          fi

          echo "HOST is configured."
          
          flutter build apk \
            --dart-define=HOST="$HOST"

      - name: Rename APK for artifact
        run: |
          mkdir -p build/app/outputs/apk/release/
          mv build/app/outputs/apk/release/app-release.apk \
             build/app/outputs/apk/release/Soft.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soft
          path: build/app/outputs/apk/release/Soft.apk
